server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**,/user/**,/booking/**,/bookings/**
        - id: hotel-service
          uri: lb://HOTEL-SERVICE
          predicates:
            - Path=/api/hotels/**,/api/rooms/**
          filters:
            - RewritePath=/api/rooms/(?<segment>.*)/confirm-availability,/forbidden
            - RewritePath=/api/rooms/(?<segment>.*)/release,/forbidden

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/